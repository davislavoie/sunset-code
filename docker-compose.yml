services:
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: sunset_images
    volumes:
      - influxdb_data:/var/lib/influxdb
    ports:
      - "8086:8086"

  imageserver:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /pictures
    command: ["python3", "-m", "http.server", "8080"]
    volumes:
      - pictures_data:/pictures:ro
    ports:
      - "8080:8080"

  capture-bolton_summit_cam:
    build: .   # the one shared image (Dockerfile); its default command is the capture loop
    restart: unless-stopped
    depends_on:
      - influxdb
      - imageserver
    env_file:
      - config/bolton_summit_cam.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - pictures_data:/pictures

  capture-btv_echo_cam:
    build: .   # the one shared image (Dockerfile); its default command is the capture loop
    restart: unless-stopped
    depends_on:
      - influxdb
      - imageserver
    env_file:
      - config/btv_echo_cam.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - pictures_data:/pictures

  dashboard:
    build: .
    working_dir: /app/html_project
    command: ["python", "backend.py"]
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ./config:/app/config:ro
      - ./sunset_code:/app/sunset_code:ro   # hsv_score.json: the score's numbers, read live by the dashboard
    ports:
      - "8502:8502"

volumes:
  influxdb_data:
  pictures_data:
