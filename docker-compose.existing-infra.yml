# Use this file if you have an existing InfluxDB and photos folder.
# Run with: docker compose -f docker-compose.existing-infra.yml up -d --build --remove-orphans

services:
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    volumes:
      - influxdb-storage:/var/lib/influxdb
    ports:
      - "8086:8086"

  imageserver:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /pictures
    command: ["python3", "-m", "http.server", "8080"]
    volumes:
      - ${HOME}/Pictures:/pictures:ro
    ports:
      - "8080:8080"

  capture-bolton_summit_cam:
    build: .   # the one shared image (Dockerfile); its default command is the capture loop
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/bolton_summit_cam.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  capture-btv_echo_cam:
    build: .   # the one shared image (Dockerfile); its default command is the capture loop
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/btv_echo_cam.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  capture-wcax_tower_sunrise:
    build: .   # the one shared image (Dockerfile); its default command is the capture loop
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/wcax_tower_sunrise.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  capture-wcax_tower_sunset:
    build: .   # the one shared image (Dockerfile); its default command is the capture loop
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/wcax_tower_sunset.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  dashboard:
    build: .
    working_dir: /app/html_project
    command: ["python", "backend.py"]
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
      PICTURES_PATH: ${HOME}/Pictures
      REBUILD_WEBHOOK_URL: http://rebuild-webhook:9999/rebuild
      REBUILD_TOKEN: ${REBUILD_TOKEN:-changeme}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # in .env; gates /admin and /api/admin
    volumes:
      - ./config:/app/config
      - ./docker-compose.existing-infra.yml:/app/docker-compose.yml
      - ./sunset_code:/app/sunset_code:ro   # hsv_score.json: the score's numbers, read live by the dashboard
      - ${HOME}/Pictures:/pictures:ro   # photos read straight off disk for thumbnails / the image proxy
      - thumb-cache:/cache              # thumbnails made from them (/api/thumb)
    ports:
      - "8502:8502"

  # ai-analysis adds weather, the sunset forecast and sky read, view fingerprints and the glass-lake
  # check to each capture in InfluxDB, applies thumbs up/down, and rescores after a score change.
  # Ollama serves the local vision model for the sky read.
  ollama:
    image: ollama/ollama:latest   # needs >= 0.12.7 for qwen3-vl
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # one photo at a time
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "10m"        # unload the model between batches to free RAM
    mem_limit: 6g                     # leave headroom on the 16GB NUC for capture + InfluxDB
    expose:
      - "11434"

  ai-analysis:
    build: .
    command: ["python", "-m", "ai_analysis", "watch"]
    restart: unless-stopped
    depends_on:
      - ollama
      - influxdb
      - imageserver
    environment:
      OLLAMA_URL: http://ollama:11434
      # Empty = AI off. When on, it only rules out frames it calls dark or "no signal";
      # its 0-100 score is shown in the dashboard for information.
      AI_MODEL: ${AI_MODEL:-}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      # Stored image urls use the public IMAGE_BASE_URL; fetch them via the compose network instead.
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
      IMAGE_FETCH_URL: http://imageserver:8080
      # Rescoring reads the photos; drop-ranked --delete removes the old ranked PNGs.
      PICTURES_DIR: /pictures
      TIMEZONE: ${TIMEZONE:-America/New_York}
      CONFIG_DIR: /app/config        # camera LAT/LON for weather
    volumes:
      - ${HOME}/Pictures:/pictures   # same folder the capture containers use
      - ./config:/app/config:ro

  rebuild-webhook:
    image: docker:cli
    restart: unless-stopped
    working_dir: /app
    environment:
      REBUILD_TOKEN: ${REBUILD_TOKEN:-changeme}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    command: >
      sh -c "apk add --no-cache python3 && python3 webhook.py"
    expose:
      - "9999"

volumes:
  influxdb-storage:
    external: true
  thumb-cache:
  ollama-models:
