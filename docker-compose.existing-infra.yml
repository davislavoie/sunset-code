# Use this file if you have an existing InfluxDB and photos folder.
# Run with: docker-compose -f docker-compose.existing-infra.yml up -d --build

services:
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    volumes:
      - influxdb-storage:/var/lib/influxdb
    ports:
      - "8086:8086"

  imageserver:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /pictures
    command: ["python3", "-m", "http.server", "8080"]
    volumes:
      - ${HOME}/Pictures:/pictures:ro
    ports:
      - "8080:8080"

  capture-bolton_summit_cam:
    build:
      context: .
      dockerfile: sunset_code/Dockerfile
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/bolton_summit_cam.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  capture-btv_echo_cam:
    build:
      context: .
      dockerfile: sunset_code/Dockerfile
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/btv_echo_cam.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  capture-wcax_tower_sunrise:
    build:
      context: .
      dockerfile: sunset_code/Dockerfile
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/wcax_tower_sunrise.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  capture-wcax_tower_sunset:
    build:
      context: .
      dockerfile: sunset_code/Dockerfile
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file:
      - config/wcax_tower_sunset.env
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - ${HOME}/Pictures:/pictures

  dashboard:
    build: ./html_project
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
      PICTURES_PATH: ${HOME}/Pictures
      REBUILD_WEBHOOK_URL: http://rebuild-webhook:9999/rebuild
      REBUILD_TOKEN: ${REBUILD_TOKEN:-changeme}
    volumes:
      - ./config:/app/config
      - ./docker-compose.existing-infra.yml:/app/docker-compose.yml
      - ./sunset_code:/sunset_code   # scoring multipliers (read by the dashboard, saved by admin Scoring)
    ports:
      - "8502:8502"

  rebuild-webhook:
    image: docker:cli
    restart: unless-stopped
    working_dir: /app
    environment:
      REBUILD_TOKEN: ${REBUILD_TOKEN:-changeme}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    command: >
      sh -c "apk add --no-cache python3 && python3 webhook.py"
    expose:
      - "9999"

volumes:
  influxdb-storage:
    external: true
