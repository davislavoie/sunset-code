# Use this file if you have an existing InfluxDB and photos folder.
# Run with: docker-compose -f docker-compose.existing-infra.yml up -d --build

services:
  imageserver:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /pictures
    command: ["python3", "-m", "http.server", "8080"]
    volumes:
      - /home/YOUR_USER/Pictures:/pictures:ro
    ports:
      - "8080:8080"

  capture-bolton_summit_cam:
    build:
      context: .
      dockerfile: sunset_code/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - config/bolton_summit_cam.env
    environment:
      INFLUXDB_HOST: host.docker.internal
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - /home/YOUR_USER/Pictures:/pictures

  capture-btv_echo_cam:
    build:
      context: .
      dockerfile: sunset_code/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - config/btv_echo_cam.env
    environment:
      INFLUXDB_HOST: host.docker.internal
      INFLUXDB_PORT: "8086"
      PICTURES_DIR: /pictures
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080}
    volumes:
      - /home/YOUR_USER/Pictures:/pictures

  dashboard:
    build: ./html_project
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INFLUXDB_HOST: host.docker.internal
      INFLUXDB_PORT: "8086"
    ports:
      - "8502:8502"
