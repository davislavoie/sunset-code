<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sunset Dashboard</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <button id="collapse-btn" class="icon-btn collapse-btn" title="Collapse sidebar">«</button>

        <div class="sidebar-header">
          <h2>Navigation</h2>
        </div>

        <h3>Camera Selection</h3>
        <select id="camera-select"></select>

        <hr />

        <button class="nav-btn active" data-page="gallery">Sunset Calendar</button>
        <button class="nav-btn" data-page="ranking">Ranked Images</button>
        <button class="nav-btn" data-page="scoretracker">Score Tracker</button>
        <button class="nav-btn" data-page="hsvtuner">HSV Tuner</button>
        <button class="nav-btn" data-page="rankingexplained">Ranking Explained</button>
        <button class="nav-btn" data-page="config">Config</button>
      </div>
    </aside>

    <button id="expand-btn" class="icon-btn expand-btn" title="Expand sidebar" hidden>»</button>

    <main id="content">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
